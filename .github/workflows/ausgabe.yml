name: Ausgabe bauen

on:
  # 6, 13 und 19 Uhr Berliner Zeit. GitHub rechnet in UTC, deshalb sind Sommer- und
  # Winterzeit eingetragen; der erste Schritt lässt nur den passenden Lauf weiter.
  schedule:
    - cron: "3 4,5,11,12,17,18 * * *"
  workflow_dispatch:
  push:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ausgabe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Passende Uhrzeit?
        id: gate
        run: |
          hour=$(TZ=Europe/Berlin date +%H)
          if [ "${{ github.event_name }}" != "schedule" ] || [[ "$hour" =~ ^(06|13|19)$ ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Berliner Zeit $hour Uhr: kein Ausgabetermin."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Claude Code installieren
        if: steps.gate.outputs.run == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Ausgabe bauen
        if: steps.gate.outputs.run == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRIEFING_MODEL: ${{ vars.BRIEFING_MODEL || 'sonnet' }}
          BRIEFING_SITE_URL: ${{ vars.BRIEFING_SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
        run: python -m briefing.build --out site --dump raw.json

      - name: Debug-Dump (nur Test-Branches)
        if: steps.gate.outputs.run == 'true' && github.ref != 'refs/heads/main'
        run: tar czf - raw.json site/index.html | base64 -w0 > dump.b64 && echo "DUMP-BEGIN" && cat dump.b64 && echo && echo "DUMP-END"

      - name: Ausgabe als Download (zum Prüfen)
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ausgabe
          path: |
            site
            raw.json
          retention-days: 7

      - name: Für GitHub Pages bereitstellen
        if: steps.gate.outputs.run == 'true' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

    outputs:
      run: ${{ steps.gate.outputs.run }}

  deploy:
    needs: build
    if: needs.build.outputs.run == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
