name: Ausgabe bauen

on:
  # 6, 13 und 19 Uhr Berliner Zeit. GitHub rechnet in UTC: eine Zeile für Sommer-, eine für
  # Winterzeit. Der erste Schritt lässt nur die zur aktuellen Zeit passende Zeile weiter.
  # Geprüft wird die auslösende Zeile, nicht die Uhrzeit, weil GitHub geplante Läufe oft verspätet startet.
  schedule:
    - cron: "3 4,11,17 * * *"   # Sommerzeit (UTC+2)
    - cron: "3 5,12,18 * * *"   # Winterzeit (UTC+1)
  workflow_dispatch:
  push:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ausgabe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Passende Uhrzeit?
        id: gate
        run: |
          offset=$(TZ=Europe/Berlin date +%z)
          [ "$offset" = "+0200" ] && want="3 4,11,17 * * *" || want="3 5,12,18 * * *"
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" != "$want" ]; then
            echo "Zeile '${{ github.event.schedule }}' gilt nicht bei Berliner Offset $offset."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            # Reserve-Lauf: Hat Home Assistant die Ausgabe schon pünktlich angestoßen, nicht doppelt bauen.
            site="${{ vars.BRIEFING_SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}"
            age=$(curl -fsS "$site/data.json?t=$(date +%s)" | python3 -c 'import json,sys,datetime as d; g=d.datetime.fromisoformat(json.load(sys.stdin)["generated"]); print(int((d.datetime.now(d.timezone.utc)-g).total_seconds()//60))' 2>/dev/null || echo 9999)
            if [ "$age" -lt 90 ]; then
              echo "Ausgabe ist erst $age Minuten alt, Reserve-Lauf entfällt."
              echo "run=false" >> "$GITHUB_OUTPUT"
            else
              echo "run=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Claude Code installieren
        if: steps.gate.outputs.run == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Ausgabe bauen
        if: steps.gate.outputs.run == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRIEFING_MODEL: ${{ vars.BRIEFING_MODEL || 'sonnet' }}
          BRIEFING_SITE_URL: ${{ vars.BRIEFING_SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
        run: python -m briefing.build --out site --dump raw.json

      - name: Ausgabe als Download (zum Prüfen)
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ausgabe
          path: |
            site
            raw*.json
          retention-days: 7

      - name: Für GitHub Pages bereitstellen
        if: steps.gate.outputs.run == 'true' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

    outputs:
      run: ${{ steps.gate.outputs.run }}

  deploy:
    needs: build
    if: needs.build.outputs.run == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
