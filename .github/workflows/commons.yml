name: Vignetten-Fotos suchen

on:
  push:
    branches: [vignette-fotos]
    paths: ["tools/commons_suche.py", ".github/workflows/commons.yml"]

permissions:
  contents: write

jobs:
  suche:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/commons_suche.py kandidaten
      - name: Kandidaten einchecken
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kandidaten
          git commit -m "Fotokandidaten von Wikimedia Commons" || exit 0
          git push
