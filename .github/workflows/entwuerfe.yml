name: Design-Entwürfe

on:
  push:
    branches: [design-entwuerfe]
    paths: ["templates/**", "static/**", "briefing/**", "tools/**", ".github/workflows/entwuerfe.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Alle Entwürfe mit echten Daten bauen
        run: |
          python -m briefing.build --out pages/klassik --dump raw.json
          for d in swiss magazin terminal kacheln brief; do
            python -m briefing.build --fixture raw.json --design $d --out pages/$d
          done
      - name: Screenshots
        run: |
          npm init -y >/dev/null && npm install playwright@1.48.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          node tools/entwuerfe.mjs pages entwuerfe
      - name: Bilder einchecken
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add entwuerfe/entwurf-*.png
          git commit -m "Vorschaubilder der Entwürfe aktualisieren" || exit 0
          git push
